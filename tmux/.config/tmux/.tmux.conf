# ==========================
# General Settings
# ==========================
unbind r
bind r source-file ~/.config/tmux/.tmux.conf \; run-shell ~/.config/tmux/scripts/auto_theme.sh \; display-message "Config reloaded & Theme updated..."

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

set -g default-shell /opt/homebrew/bin/bash
# Fix colors for transparency
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Prevent inherited underline on the active window
set -gw window-status-current-style 'none'
# Top status bar + one blank row beneath it
set -g status 2
set -g 'status-format[1]' ''

# ==========================
# Auto-Theme Logic
# ==========================
# 1. Run the theme script when tmux starts
run-shell ~/.config/tmux/scripts/auto_theme.sh

# 2. Add a hook: Check the theme every time you attach to a session
set-hook -g client-attached 'run-shell ~/.config/tmux/scripts/auto_theme.sh'