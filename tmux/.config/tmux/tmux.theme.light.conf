# LIGHT THEME - Catppuccin Latte
# Colors: Blue=#1e66f5, Orange=#fe640b, Gray=#acb0be, White=#eff1f5, TextDark=#4c4f69

set -g default-shell /opt/homebrew/bin/bash
set -g status-position top
set -g status-style 'bg=default' # Transparent
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Left Side (Session)
set -g status-left '#[fg=#1e66f5,bg=default]#[fg=#eff1f5,bg=#1e66f5,bold]   #S #[fg=#1e66f5,bg=default]  '

# Right Side (Directory & Time)
set -g status-right '#[fg=#1e66f5,bg=default] #[fg=#eff1f5,bg=#1e66f5]   #{b:pane_current_path} #[fg=#1e66f5,bg=default]'
set -ga status-right '#[fg=#fe640b,bg=default] #[fg=#eff1f5,bg=#fe640b] 󱑒 %H:%M #[fg=#fe640b,bg=default] '

# Window Status
set -g window-status-format '#[fg=#acb0be,bg=default] #[fg=#4c4f69,bg=#acb0be] #I  #W #[fg=#acb0be,bg=default]'
set -g window-status-current-format '#[fg=#fe640b,bg=default] #[fg=#eff1f5,bg=#fe640b,bold] #I  #W #[fg=#fe640b,bg=default]'

# Borders & Messages
set -g pane-border-style 'fg=#eff1f5'
set -g pane-active-border-style 'fg=#fe640b'
set -g message-style 'fg=#eff1f5,bg=#fe640b,bold'