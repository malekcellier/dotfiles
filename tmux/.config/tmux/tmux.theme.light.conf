
# LIGHT THEME - Catppuccin Latte
# Colors:
# Green=#40a02b, Blue=#1e66f5, Peach=#fe640b, Pink=#ea76cb
# Text=#4c4f69, Surface0=#ccd0da, Base=#eff1f5

set -g status-position top
set -g status-style 'bg=default' # Transparent background
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Session
set -g status-left '#[fg=#40a02b,bg=default]#[fg=#eff1f5,bg=#40a02b] #[fg=#4c4f69,bg=#ccd0da] #S#[fg=#ccd0da,bg=default]#[default] '

# Inactive windows
set -g window-status-format '#[fg=#ccd0da,bg=default]#[fg=#4c4f69,bg=#ccd0da]#W #[fg=#eff1f5,bg=#1e66f5] #I#[fg=#1e66f5,bg=default]#[default]'

# Active window
set -g window-status-current-format '#[fg=#ccd0da,bg=default]#[fg=#4c4f69,bg=#ccd0da]#W #[fg=#4c4f69,bg=#fe640b,bold] #I#[fg=#fe640b,bg=default]#[default]'

# Spacing between windows
set -g window-status-separator ' '

# Right side: pink folder icon + current directory
set -g status-right '#[fg=#ea76cb,bg=default]#[fg=#4c4f69,bg=#ea76cb] #[fg=#4c4f69,bg=#ccd0da] #{b:pane_current_path}#[fg=#ccd0da,bg=default]#[default]'

# Clock: peach pill, 24-hour format
set -ga status-right ' #[fg=#fe640b,bg=default]#[fg=#4c4f69,bg=#fe640b]󱑒 %H:%M#[fg=#fe640b,bg=default]#[default]'

# Borders & Messages
set -g pane-border-style 'fg=#ccd0da'
set -g pane-active-border-style 'fg=#fe640b'
set -g message-style 'fg=#eff1f5,bg=#fe640b,bold'
