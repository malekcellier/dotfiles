# DARK THEME - Catppuccin Mocha
# Colors: Blue=#89b4fa, Peach=#fab387, Gray=#45475a, Dark=#1e1e2e

set -g status-position top
set -g status-style 'bg=default' # Transparent background
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Left Side (Session)
set -g status-left '#[fg=#89b4fa,bg=default]#[fg=#1e1e2e,bg=#89b4fa,bold]   #S #[fg=#89b4fa,bg=default]  '

# Right Side (Directory & Time)
set -g status-right '#[fg=#89b4fa,bg=default] #[fg=#1e1e2e,bg=#89b4fa]   #{b:pane_current_path} #[fg=#89b4fa,bg=default]'
set -ga status-right '#[fg=#fab387,bg=default] #[fg=#1e1e2e,bg=#fab387] 󱑒 %H:%M #[fg=#fab387,bg=default] '

# Window Status
set -g window-status-format '#[fg=#45475a,bg=default] #[fg=#cdd6f4,bg=#45475a] #I  #W #[fg=#45475a,bg=default]'
set -g window-status-current-format '#[fg=#fab387,bg=default] #[fg=#1e1e2e,bg=#fab387,bold] #I  #W #[fg=#fab387,bg=default]'

# Borders & Messages
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#fab387'
set -g message-style 'fg=#fab387,bg=#313244,bold'