# DARK THEME - Catppuccin Mocha
# Colors: Blue=#89b4fa, Peach=#fab387, Gray=#45475a, Dark=#1e1e2e

set -g status-position top
set -g status-style 'bg=default' # Transparent background
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Session
set -g status-left '#[fg=#a6e3a1,bg=default]#[fg=#1e1e2e,bg=#a6e3a1] #[fg=#cdd6f4,bg=#313244] #S#[fg=#313244,bg=default]#[default] '

# Inactive windows
set -g window-status-format '#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244]#W #[fg=#1e1e2e,bg=#89b4fa] #I#[fg=#89b4fa,bg=default]#[default]'
# Active window
set -g window-status-current-format '#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244]#W #[fg=#1e1e2e,bg=#fab387,bold] #I#[fg=#fab387,bg=default]#[default]'
# Spacing between windows
set -g window-status-separator ' '

# Right side: pink folder icon + current directory
set -g status-right '#[fg=#f5c2e7,bg=default]#[fg=#1e1e2e,bg=#f5c2e7] #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path}#[fg=#313244,bg=default]#[default]'
# Clock: peach pill, 24-hour format
set -ga status-right ' #[fg=#fab387,bg=default]#[fg=#1e1e2e,bg=#fab387]󱑒 %H:%M#[fg=#fab387,bg=default]#[default]'

# Borders & Messages
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#fab387'
set -g message-style 'fg=#fab387,bg=#313244,bold'